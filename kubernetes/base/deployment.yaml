apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-cloud-devsecops-platform
  namespace: multi-cloud-capstone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multi-cloud-devsecops-platform
  template:
    metadata:
      labels:
        app: multi-cloud-devsecops-platform
    spec:
      containers:
        - name: app
image: europe-west2-docker.pkg.dev/lawal-project-84096/kubernetes-gitops-platform/multi-cloud-devsecops-platform:8e6986704f85adbbac83a4315f3723e138e20f6b
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "production"
            - name: CLOUD_PROVIDER
              value: "gcp"
            - name: APP_VERSION
              value: "6b334b0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
