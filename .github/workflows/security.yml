name: Security CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: DevSecOps Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gitleaks
        shell: bash
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep '"tag_name"' \
            | cut -d '"' -f 4)

          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --verbose

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Semgrep
        run: |
          semgrep scan \
            --config auto \
            --error \
            app

      - name: Install Checkov
        run: |
          python -m pip install checkov

      - name: Checkov
        run: |
          checkov \
            -d terraform \
            --framework terraform \
            --soft-fail

      - name: Install Trivy
        shell: bash
        run: |
          VERSION=$(curl -s https://api.github.com/repos/aquasecurity/trivy/releases/latest \
            | grep '"tag_name"' \
            | cut -d '"' -f 4)

          curl -sSL \
            "https://github.com/aquasecurity/trivy/releases/download/${VERSION}/trivy_${VERSION#v}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz

          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy

      - name: Trivy filesystem scan
        run: |
          trivy fs \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            app

      - name: Trivy Terraform scan
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            terraform
